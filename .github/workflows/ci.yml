name: ReaFull CI & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Lint, Sanitize Check & Test Installation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig

      - name: Python Syntax & Compilation Check
        run: |
          python3 -m py_compile install.py
          python3 -m py_compile scripts/verify_installation.py
          python3 -m py_compile scripts/audit_licenses.py
          python3 -m py_compile scripts/clean_fxfolders.py
          python3 -m py_compile scripts/apply_rebranding.py
          python3 -m py_compile scripts/clean_templates_final.py

      - name: Audit License & Attribution Inventory
        run: |
          python3 scripts/audit_licenses.py

      - name: Verify Release Integrity Policy
        run: |
          python3 - <<'PY'
          import install
          expected = "565d40111b6e55ccebdd0666c397896b781f4a9e36ae46d1c9b185f3a092527a"
          key = f"reafull-assets-v{install.VERSION}.tar.gz"
          assert install.KNOWN_HASHES.get(key) == expected, f"Missing or incorrect hash for {key}"
          assert install.KNOWN_HASHES.get("sws_x86_64")
          assert install.KNOWN_HASHES.get("reapack_x86_64")
          print("PASSED: release asset and extension hashes are pinned.")
          PY
          ! grep -Fq 'curl -fsSL' assets/Scripts/ReaFull/ReaFull_Updater.lua

      - name: Audit for Windows Drive Paths (Linter Gate)
        run: |
          echo "=== Auditing templates and scripts for leftover Windows paths ==="
          python3 -c '
          import os, re, sys
          errors = []
          for scan_dir in ["config_templates", "assets/Scripts/ReaFull"]:
              if not os.path.exists(scan_dir):
                  continue
              for root, _, files in os.walk(scan_dir):
                  for f in files:
                      if f.endswith((".ini", ".lua", ".py")):
                          fp = os.path.join(root, f)
                          with open(fp, "r", encoding="utf-8", errors="ignore") as file:
                              for i, line in enumerate(file, 1):
                                  if re.search(r"^[a-zA-Z]:[\\/]", line.strip()) and not ("http://" in line or "https://" in line):
                                      errors.append(f"{fp}:{i}: {line.strip()}")
          if errors:
              print(f"FAILED: Found {len(errors)} Windows drive paths:")
              for err in errors:
                  print(f"  {err}")
              sys.exit(1)
          else:
              print("PASSED: Zero Windows drive paths found.")
          '

      - name: Verify Configuration Templates
        run: |
          python3 scripts/verify_installation.py config_templates

      - name: Test Installer Dry Run (Core Preset)
        run: |
          ./install.sh --quiet --dry-run --preset core --target /tmp/reafull_ci_dryrun

      - name: Test Installer Dry Run (Minimal Preset)
        run: |
          ./install.sh --quiet --dry-run --preset minimal --target /tmp/reafull_ci_min_dryrun

      - name: Test Real Deployment (Minimal Preset) & Component-Aware Verification
        run: |
          ./install.sh --quiet --preset minimal --target /tmp/reafull_ci_minimal
          python3 scripts/verify_installation.py /tmp/reafull_ci_minimal --components themes,fonts,audio_tuning

      - name: Test Real Deployment (Core Preset) & Health Verification
        run: |
          ./install.sh --quiet --preset core --target /tmp/reafull_ci_core
          python3 scripts/verify_installation.py /tmp/reafull_ci_core

      - name: Test Safe Overlay Non-Destructive Mode
        run: |
          echo "; Custom test shortcut" >> /tmp/reafull_ci_core/reaper-kb.ini
          ./install.sh --quiet --preset core --target /tmp/reafull_ci_core
          grep "Custom test shortcut" /tmp/reafull_ci_core/reaper-kb.ini
          test -f /tmp/reafull_ci_core/reaper-kb.ini.reafull
          python3 scripts/verify_installation.py /tmp/reafull_ci_core

      - name: Test Full Deployment & Health Verification
        run: |
          ./install.sh --quiet --all --target /tmp/reafull_ci_full
          python3 scripts/verify_installation.py /tmp/reafull_ci_full
