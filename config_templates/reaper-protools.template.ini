# ReaFull Pro Tools Mode - REAPER Configuration Overrides
# Applied on top of the base reaper.ini when the "Pro Tools Mode" component is selected.
# These settings emulate a Pro Tools–style editing workflow in REAPER.

[reaper]
# --- Edit Behavior ---
# Ripple per-track (1 = per-track, 2 = all tracks) — PT uses per-track by default
ripplepertrack=1
ripplelockmode=0

# Auto-crossfade: 0=disabled, 1=crossfade on overlap, 2=auto-crossfade
# PT does not auto-crossfade; items are separated by default
autoxfade=0
splitautoxfade=0

# Item editing: separate items on the same track (no overlapping items)
# 0=allow overlap, 1=trim left of new item, 2=split and push
newitemlenmode=0

# Snap settings — grid-based snapping like PT
projrelsnap=1
projgridsnapmin=4
projgriddivsnap=0.25000000
itemsnap=1
snapextraden=0
maxsnaptrack=0

# Grid: default to 1/16 note musical grid
projgrid=4

# Edit cursor follows playback (like PT edit cursor)
editcursorcontext=1

# Tool mode: smart tool behavior
toolmode=5

# Track Control Panel layout: compact vertical meters (PT-like)
layout_tcp=1 TCP竖
layout_mcp=1 MIXER A
layout_master_mcp=A

# Zoom: default vertical zoom level
zoomenvheight=48
zoomfont=12

# Options > Editing: trim content behind items when editing (PT-style razor edit)
trimcontentbehind=1

# Crossfade editor: show on crossfade click
xfadeedit_open=1

# Selector tool: right-click opens context menu (PT-like)
tcp_behavior=1

# Media item defaults
item_defaults=0
defaultfadeinlen=10
defaultfadeoutlen=10
defaultfadeinsil=1000
defaultfadeoutsil=1000

# Tab key behavior: move cursor to next item edge (PT-like)
tabediting=1

# Nudge values: set to bar/beat like PT
nudge_title1=Bar
nudge_title2=Beat
nudge_title3=Tick
nudge_title4=Frame

# MIDI Editor: piano roll defaults
midieditor=198272
midiprogpar=1
midiproyz=0

# Transport: show in main window (PT-style single-window)
transport_vis=1
transport_dock=1

# Mixer: show meters in TCP (PT-like track meters)
mcp_meters=1

# Record: default to destructive in layers (PT-like playlist behavior)
projrecmode=1
projrecfiletype=wav

# Routing: I/O like PT (mono/stereo flexible)
iopers=0
